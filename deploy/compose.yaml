services:
  # EMQX / Redis 等待 Docker Hub 网络恢复后解注并拉取镜像
  # 届时使用: docker compose --profile dji up -d emqx redis
  # emqx:
  #   profiles: ["dji"]
  #   image: emqx/emqx:5.7
  #   restart: unless-stopped
  #   environment:
  #     - EMQX_ALLOW_ANONYMOUS=true
  #   ports:
  #     - "1883:1883"
  #     - "8083:8083"
  #     - "18083:18083"
  #   networks:
  #     - mqtt
  #
  # redis:
  #   profiles: ["dji"]
  #   image: redis:7-alpine
  #   restart: unless-stopped
  #   networks:
  #     - mqtt

  # MinIO 对象存储：存储 KMZ 航线文件和巡检媒体
  # 控制台: http://localhost:9001  API: http://localhost:9000
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${UAV_OSS_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${UAV_OSS_SECRET_KEY:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - application
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 114.114.114.114
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      UAV_DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      UAV_DB_USERNAME: ${MYSQL_USER}
      UAV_DB_PASSWORD: ${MYSQL_PASSWORD}
      UAV_ALLOWED_ORIGIN_PATTERNS: ${UAV_ALLOWED_ORIGIN_PATTERNS}
      UAV_DEMO_AUTH_ENABLED: "false"
      UAV_DJI_CLOUD_ENABLED: "true"
      UAV_DJI_CLOUD_BASE_URL: ${UAV_DJI_CLOUD_BASE_URL}
      UAV_DJI_CLOUD_CLIENT_ID: ${UAV_DJI_CLOUD_CLIENT_ID}
      UAV_DJI_CLOUD_CLIENT_SECRET: ${UAV_DJI_CLOUD_KEY}
      UAV_DJI_CLOUD_LICENSE: ${UAV_DJI_CLOUD_LICENSE}
      UAV_DJI_MQTT_ENABLED: "false"
      UAV_DJI_MQTT_BROKER_URL: wss://api.dji.com:8883
      # 机场网关 SN 必须只由未纳入 Git 的环境变量注入。
      UAV_DJI_MQTT_GATEWAY_SN: ${UAV_DJI_MQTT_GATEWAY_SN:-}
      UAV_DJI_MQTT_CLIENT_ID: uav-command-backend
      UAV_REDIS_HOST: redis
      UAV_REDIS_PORT: "6379"
      # 对象存储（MinIO）
      UAV_OSS_ENABLED: "true"
      UAV_OSS_PROVIDER: minio
      UAV_OSS_ENDPOINT: http://minio:9000
      UAV_OSS_ACCESS_KEY: ${UAV_OSS_ACCESS_KEY:-minioadmin}
      UAV_OSS_SECRET_KEY: ${UAV_OSS_SECRET_KEY:-minioadmin}
      UAV_OSS_BUCKET: ${UAV_OSS_BUCKET:-uav-command}
      UAV_OSS_REGION: us-east-1
      UAV_OSS_PUBLIC_ENDPOINT: http://localhost:9000
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - database
      - application

  web:
    build:
      context: ../frontend
    restart: unless-stopped
    ports:
      - "${UAV_WEB_PORT}:80"
    depends_on:
      - backend
    networks:
      - application

volumes:
  mysql-data:
  minio-data:

networks:
  database:
    internal: true
  application:
