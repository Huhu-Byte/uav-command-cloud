server:
  port: 8080

spring:
  main:
    allow-circular-references: true
  application:
    name: uav-command-backend
  # Redis 依赖已引入（供未来使用），但当前没有任何代码使用它。
  # 排除自动配置，避免无 Redis 服务时启动失败。
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  datasource:
    url: jdbc:h2:mem:uav-command;MODE=MySQL;DB_CLOSE_DELAY=-1;TRACE_LEVEL_FILE=0
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

app:
  cors:
    allowed-origin-patterns: ${UAV_ALLOWED_ORIGIN_PATTERNS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
  security:
    demo-auth-enabled: ${UAV_DEMO_AUTH_ENABLED:true}
  dji-cloud:
    enabled: ${UAV_DJI_CLOUD_ENABLED:false}
    base-url: ${UAV_DJI_CLOUD_BASE_URL:}
    client-id: ${UAV_DJI_CLOUD_CLIENT_ID:}
    client-secret: ${UAV_DJI_CLOUD_CLIENT_SECRET:}
    app-id: ${UAV_DJI_CLOUD_APP_ID:}
    app-key: ${UAV_DJI_CLOUD_APP_KEY:}
    app-license: ${UAV_DJI_CLOUD_APP_LICENSE:}
    connect-timeout-ms: ${UAV_DJI_CLOUD_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${UAV_DJI_CLOUD_READ_TIMEOUT_MS:5000}
    max-retries: ${UAV_DJI_CLOUD_MAX_RETRIES:2}
    token-expire-sec: ${UAV_DJI_CLOUD_TOKEN_EXPIRE_SEC:86400}
    token-secret: ${UAV_DJI_CLOUD_TOKEN_SECRET:uav-command-default-secret}
    admin-username: ${UAV_DJI_CLOUD_ADMIN_USERNAME:adminPC}
    admin-password: ${UAV_DJI_CLOUD_ADMIN_PASSWORD:adminPC}
  dji-mqtt:
    enabled: ${UAV_DJI_MQTT_ENABLED:false}
    broker-url: ${UAV_DJI_MQTT_BROKER_URL:}
    client-id: ${UAV_DJI_MQTT_CLIENT_ID:}
    username: ${UAV_DJI_MQTT_USERNAME:}
    password: ${UAV_DJI_MQTT_PASSWORD:}
    connect-timeout-ms: ${UAV_DJI_MQTT_CONNECT_TIMEOUT_MS:5000}
    keep-alive-sec: ${UAV_DJI_MQTT_KEEP_ALIVE_SEC:30}
    clean-session: ${UAV_DJI_MQTT_CLEAN_SESSION:true}
    handshake-enabled: ${UAV_DJI_MQTT_HANDSHAKE_ENABLED:false}
    gateway-sn: ${UAV_DJI_MQTT_GATEWAY_SN:}
    device-binding-code: ${UAV_DJI_DEVICE_BINDING_CODE:}
    # 内嵌 Broker 开关（本机联调用）
    embedded-broker: ${UAV_DJI_MQTT_EMBEDDED_BROKER:false}
    # 内嵌 Broker 端口，0 = 使用默认 1883
    broker-port: ${UAV_DJI_MQTT_BROKER_PORT:0}
  redis:
    host: ${UAV_REDIS_HOST:localhost}
    port: ${UAV_REDIS_PORT:6379}
  oss:
    enabled: ${UAV_OSS_ENABLED:false}
    provider: ${UAV_OSS_PROVIDER:minio}
    endpoint: ${UAV_OSS_ENDPOINT:}
    access-key: ${UAV_OSS_ACCESS_KEY:}
    secret-key: ${UAV_OSS_SECRET_KEY:}
    bucket: ${UAV_OSS_BUCKET:uav-command}
    region: ${UAV_OSS_REGION:us-east-1}
    wayline-prefix: ${UAV_OSS_WAYLINE_PREFIX:waylines}
    media-prefix: ${UAV_OSS_MEDIA_PREFIX:media}
    sts-expire-sec: ${UAV_OSS_STS_EXPIRE_SEC:3600}
    public-endpoint: ${UAV_OSS_PUBLIC_ENDPOINT:}
